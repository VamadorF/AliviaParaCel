name: Frontend CI

on:
  push:
    branches: [main, develop, feat/plan-frontend-movil]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      # sync-core --check compara src/shared/core con AlivIACare (misma rama de integración web).
      - uses: actions/checkout@v4
        with:
          repository: jsfernandez/AlivIACare
          ref: feat/plan-frontend-mock
          path: AlivIACare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:ci
